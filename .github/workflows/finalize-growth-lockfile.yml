name: Finalize Growth 3D lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-growth-lockfile.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate exact pnpm lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --no-frozen-lockfile
          grep -q "^[[:space:]]*three:" pnpm-lock.yaml
          grep -q "^[[:space:]]*'@types/three':" pnpm-lock.yaml

      - name: Restore frozen-lockfile CI and remove workaround
        shell: python
        run: |
          from pathlib import Path
          ci = Path('.github/workflows/growth-v1-ci.yml')
          text = ci.read_text()
          text = text.replace('pnpm install --no-frozen-lockfile', 'pnpm install --frozen-lockfile')
          ci.write_text(text)
          npmrc = Path('.npmrc')
          if npmrc.exists():
              npmrc.unlink()

      - name: Verify production gates
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm vitest run client/src/growth/growthEngine.test.ts server/growthRepository.test.ts server/routers.test.ts || pnpm vitest run client/src/growth/growthEngine.test.ts
          pnpm vercel-build

      - name: Commit generated lock and restore strict CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-growth-lockfile.yml
          git config user.name "bible-friend-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A pnpm-lock.yaml .github/workflows/growth-v1-ci.yml .npmrc .github/workflows/finalize-growth-lockfile.yml || true
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(growth): lock 3D dependencies and restore frozen CI"
          git push origin HEAD:main
