name: Deploy TTS Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/tts-gateway
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Cloudflare token
        run: |
          node --input-type=module - <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || "";
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || "";
          if (!token || !/^[a-f0-9]{32}$/i.test(account)) {
            throw new Error("Missing token or invalid Cloudflare account ID");
          }
          if (token !== token.trim() || /\s/.test(token) || token.startsWith("Bearer ") || /["']/.test(token)) {
            throw new Error("CLOUDFLARE_API_TOKEN must contain only the token string, without whitespace, quotes, or Bearer");
          }
          const route = token.startsWith("cfat_")
            ? "/accounts/" + account + "/tokens/verify"
            : "/user/tokens/verify";
          const response = await fetch("https://api.cloudflare.com/client/v4" + route, {
            headers: { authorization: "Bearer " + token },
            signal: AbortSignal.timeout(20000),
          });
          const body = await response.json();
          const codes = (body.errors || []).map(error => error.code).join(",");
          if (!response.ok || !body.success || body.result?.status !== "active") {
            throw new Error("Cloudflare token verification failed: HTTP " + response.status + ", codes=" + codes);
          }
          console.log("Cloudflare token is active; KV permissions will be checked by bootstrap.");
          NODE
      - run: npm install
      - name: Bootstrap KV namespaces and Wrangler config
        run: node scripts/bootstrap.mjs
      - name: Build secrets file
        env:
          API_TOKEN: ${{ secrets.TTS_WORKER_API_TOKEN }}
          GPU_ENDPOINTS_JSON: ${{ secrets.GPU_ENDPOINTS_JSON }}
          QWEN3_TTS_API_TOKEN: ${{ secrets.QWEN3_TTS_API_TOKEN }}
          QWEN3_TTS_URL: https://khs0927--bible-friend-qwen3-tts-qwen3tts-web.modal.run/tts
        run: |
          node - <<'NODE'
          const fs = require("fs");
          if (!process.env.GPU_ENDPOINTS_JSON && process.env.QWEN3_TTS_API_TOKEN) {
            process.env.GPU_ENDPOINTS_JSON = JSON.stringify([{
              name: "modal-qwen3",
              url: process.env.QWEN3_TTS_URL,
              healthUrl: process.env.QWEN3_TTS_URL.replace(/\/tts$/, "/health"),
              token: process.env.QWEN3_TTS_API_TOKEN,
              timeoutMs: 55000,
              enabled: true,
            }]);
          }
          const required = ["API_TOKEN", "GPU_ENDPOINTS_JSON"];
          for (const key of required) {
            if (!process.env[key]) throw new Error(`Missing required GitHub secret: ${key}`);
          }
          const endpoints = JSON.parse(process.env.GPU_ENDPOINTS_JSON);
          if (!Array.isArray(endpoints) || endpoints.length === 0) throw new Error("At least one GPU endpoint is required");
          fs.writeFileSync(".secrets.json", JSON.stringify({
            API_TOKEN: process.env.API_TOKEN,
            GPU_ENDPOINTS_JSON: process.env.GPU_ENDPOINTS_JSON,
          }));
          NODE
      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.toml --secrets-file .secrets.json
      - name: Remove temporary secrets file
        if: always()
        run: rm -f .secrets.json wrangler.toml
