name: Sync David Goliath Story Assets

on:
  push:
    branches: [assets/david-goliath-story-pages]
    paths:
      - 'client/public/assets/story/david-goliath/source-assets.json'
      - '.github/workflows/sync-david-goliath-story-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: david-goliath-story-assets
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assets/david-goliath-story-pages
          fetch-depth: 0

      - name: Download and verify standalone originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, struct, urllib.request
          from pathlib import Path

          root = Path('client/public/assets/story/david-goliath')
          spec = json.loads((root / 'source-assets.json').read_text(encoding='utf-8'))
          if len(spec['pages']) != 30:
              raise SystemExit(f"expected 30 pages, got {len(spec['pages'])}")

          for item in spec['pages']:
              number = int(item['page'])
              target = root / f'page-{number:02d}.png'
              with urllib.request.urlopen(item['url'], timeout=90) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise SystemExit(f"SHA mismatch page {number}: {digest}")
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f"not PNG page {number}")
              width, height = struct.unpack('>II', data[16:24])
              if [width, height] != [item['width'], item['height']]:
                  raise SystemExit(f"dimension mismatch page {number}: {width}x{height}")
              target.write_bytes(data)
              print(f"verified page-{number:02d}.png {width}x{height} {digest[:12]}")
          PY

      - name: Commit verified originals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/assets/story/david-goliath/page-*.png
          if git diff --cached --quiet; then
            echo 'All 30 original story assets already match.'
          else
            git commit -m 'assets(story): materialize David Goliath pages 01-30'
            git push origin HEAD:assets/david-goliath-story-pages
          fi
