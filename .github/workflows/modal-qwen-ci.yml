name: Modal Qwen3 CI

on:
  pull_request:
    paths:
      - "deploy/modal/**"
      - ".github/workflows/modal-qwen-ci.yml"
  push:
    branches: ["main"]
    paths:
      - "deploy/modal/**"
      - ".github/workflows/modal-qwen-ci.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile deploy/modal/qwen3_tts.py
