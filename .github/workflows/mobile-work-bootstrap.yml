name: Bootstrap Mobile Work Gateway
on:
  push:
    branches: [ops/mobile-work-readiness]
    paths: [.github/workflows/mobile-work-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-work-cloudflare-bootstrap
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: mobile-work-gateway/gateway
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: khs0927/jev-browser-control-plane
          ref: be90100d5ebcdaa4750e1b2fcc4f32ebfa49e141
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Provision dedicated D1 and OAuth KV using existing account permissions
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          token=os.environ['CLOUDFLARE_API_TOKEN']; account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          def api(path,body=None):
              data=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+path,data=data,headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: value=json.load(r)
              except urllib.error.HTTPError as e:
                  value=json.load(e); raise SystemExit('Cloudflare operation failed: '+str(e.code)+' codes '+str([x.get('code') for x in value.get('errors',[])]))
              if not value.get('success'):raise SystemExit('Cloudflare operation rejected')
              return value['result']
          d1s=api('/d1/database'); d1=next((x for x in d1s if x['name']=='mobile-work-gateway'),None)
          if d1 is None:d1=api('/d1/database',{'name':'mobile-work-gateway','primary_location_hint':'apac'})
          kvs=api('/storage/kv/namespaces'); kv=next((x for x in kvs if x['title']=='mobile-work-oauth'),None)
          if kv is None:kv=api('/storage/kv/namespaces',{'title':'mobile-work-oauth'})
          subdomain=api('/workers/subdomain')['subdomain']
          origin='https://mobile-work-gateway.'+subdomain+'.workers.dev'
          config=json.load(open('wrangler.jsonc'));config['vars']['PUBLIC_URL']=origin;config['vars']['REVIEWED_SHA']='be90100d5ebcdaa4750e1b2fcc4f32ebfa49e141'
          config['d1_databases']=[{'binding':'DB','database_name':'mobile-work-gateway','database_id':d1['uuid'],'migrations_dir':'migrations'}]
          config['kv_namespaces']=[{'binding':'OAUTH_KV','id':kv['id']}]
          json.dump(config,open('wrangler.deploy.json','w'),indent=2)
          public={'public_url':origin,'reviewed_sha':config['vars']['REVIEWED_SHA'],'d1_id':d1['uuid'],'oauth_kv_id':kv['id'],'mcp_auth_configured':False}
          json.dump(public,open('deployment-evidence.json','w'),indent=2)
          print(json.dumps(public,indent=2))
          PY
      - name: Apply dedicated schema
        run: npx wrangler d1 migrations apply mobile-work-gateway --remote --config wrangler.deploy.json
      - name: Deploy fail-closed gateway
        run: npx wrangler deploy --config wrangler.deploy.json
      - name: Verify actual HTTPS endpoint and blocked unconfigured MCP
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,os,time
          evidence=json.load(open('deployment-evidence.json')); origin=evidence['public_url']
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(origin+'/health',timeout=20) as r: health=json.load(r);status=r.status
                  break
              except urllib.error.HTTPError as e:
                  print('Public health HTTP',e.code,'content-type',e.headers.get('Content-Type'),'body',e.read(2000).decode(errors='replace'))
                  raise
              except Exception:
                  if attempt==2:raise
                  time.sleep(2)
          assert status==200 and health['mcp_ready'] is False, 'Unexpected live configuration'
          try:urllib.request.urlopen(origin+'/mcp',timeout=20);raise RuntimeError('Unconfigured MCP was accepted')
          except urllib.error.HTTPError as e:assert e.code==503
          evidence['health']=health;evidence['unconfigured_mcp_http_status']=503
          json.dump(evidence,open('deployment-evidence.json','w'),indent=2)
          print(json.dumps(evidence,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('### Live fail-closed deployment\n\x60\x60\x60json\n'+json.dumps(evidence,indent=2)+'\n\x60\x60\x60\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mobile-work-deployment-evidence
          path: mobile-work-gateway/gateway/deployment-evidence.json
          retention-days: 3
          if-no-files-found: error
