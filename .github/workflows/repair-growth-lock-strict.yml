# trigger: strict-growth-lock-v2
name: Repair Growth Lock Strict

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-growth-lock-strict.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Generate exact lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Restore strict CI
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/growth-v1-ci.yml')
          if p.exists():
              s = p.read_text().replace('pnpm install --no-frozen-lockfile', 'pnpm install --frozen-lockfile')
              p.write_text(s)
          npmrc = Path('.npmrc')
          if npmrc.exists(): npmrc.unlink()
      - name: Verify lock and build
        shell: bash
        run: |
          set -euo pipefail
          grep -q "three:" pnpm-lock.yaml
          grep -q "@types/three" pnpm-lock.yaml
          pnpm install --frozen-lockfile
          pnpm vitest run client/src/growth/growthEngine.test.ts
          pnpm vercel-build
      - name: Commit repair and self-delete
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-growth-lock-strict.yml
          git config user.name "bible-friend-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(growth): lock 3D deps and restore frozen CI"
          git push origin HEAD:main
