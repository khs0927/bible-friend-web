name: Netlify Voice Lab Temp Deploy

on:
  push:
    branches:
      - netlify-voice-lab-deploy-temp
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: github.head_ref == 'netlify-voice-lab-deploy-temp' || github.ref_name == 'netlify-voice-lab-deploy-temp'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-lab-netlify
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
