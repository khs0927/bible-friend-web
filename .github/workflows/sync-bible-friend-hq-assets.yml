name: Sync Bible Friend HQ Assets

on:
  push:
    paths:
      - '.github/workflows/sync-bible-friend-hq-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove workflow execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/bible-friend/generated/hq
          printf 'GitHub Actions HQ asset sync executed successfully.\n' > public/assets/bible-friend/generated/hq/action-proof.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/bible-friend/generated/hq/action-proof.txt
          git commit -m 'chore: mark HQ asset sync execution'
          git push

      - name: Download and verify lossless HQ source assets
        shell: bash
        run: |
          set -euo pipefail
          root='public/assets/bible-friend/generated/hq'
          names=(01_app_logo.png 02_mascot_wave.png 03_mascot_heart.png 04_settings.png 05_heart.png 06_praying_hands.png 07_dove.png 08_gift.png 09_chat.png 10_story.png)
          srcs=(
            'https://cdn.creativeclaw.co/u/448e94a9/images/f1168ec5-1dc5-4e3e-917a-49ff55c4ea71.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/d44e983b-86e6-43f4-ac90-598c0798f42e.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/f07cced3-af37-42d2-8871-e823d7d559ba.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/8c4c133c-9cde-4e7c-8aa5-edd5d904c5f5.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/60e97b46-3a6a-40c2-b545-ee2228e22af2.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/c16d1ac9-fbeb-4414-aadd-466733c52b6a.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/4cfaa18d-b15f-46cb-aa8a-5b20b5359d04.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/09720e49-2ed2-4877-b5bb-1fd9dff9bf3e.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/2cc4bec8-8aa7-4fce-9f54-80507c07b940.png'
            'https://cdn.creativeclaw.co/u/448e94a9/images/6e667058-c6a3-4d7a-ac49-31bd30762e80.png'
          )
          for i in "${!names[@]}"; do
            path="$root/${names[$i]}"
            curl -fsSL --retry 3 --retry-delay 2 "${srcs[$i]}" -o "$path"
            python - "$path" <<'PY'
import struct,sys
p=sys.argv[1]
b=open(p,'rb').read(29)
if b[:8] != b'\x89PNG\r\n\x1a\n': raise SystemExit(f'not PNG: {p}')
w,h=struct.unpack('>II',b[16:24])
if w < 1000 or h < 1000: raise SystemExit(f'asset too small: {p} {w}x{h}')
print(f'VERIFIED {p}: {w}x{h}')
PY
          done

          python - <<'PY'
import hashlib,json,os,struct
root='public/assets/bible-friend/generated/hq'
srcs=[
'https://cdn.creativeclaw.co/u/448e94a9/images/f1168ec5-1dc5-4e3e-917a-49ff55c4ea71.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/d44e983b-86e6-43f4-ac90-598c0798f42e.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/f07cced3-af37-42d2-8871-e823d7d559ba.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/8c4c133c-9cde-4e7c-8aa5-edd5d904c5f5.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/60e97b46-3a6a-40c2-b545-ee2228e22af2.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/c16d1ac9-fbeb-4414-aadd-466733c52b6a.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/4cfaa18d-b15f-46cb-aa8a-5b20b5359d04.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/09720e49-2ed2-4877-b5bb-1fd9dff9bf3e.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/2cc4bec8-8aa7-4fce-9f54-80507c07b940.png',
'https://cdn.creativeclaw.co/u/448e94a9/images/6e667058-c6a3-4d7a-ac49-31bd30762e80.png']
names=['01_app_logo.png','02_mascot_wave.png','03_mascot_heart.png','04_settings.png','05_heart.png','06_praying_hands.png','07_dove.png','08_gift.png','09_chat.png','10_story.png']
items=[]
for name,src in zip(names,srcs):
 p=os.path.join(root,name); data=open(p,'rb').read(); w,h=struct.unpack('>II',data[16:24])
 items.append({'file':name,'width':w,'height':h,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'source':src})
open(os.path.join(root,'manifest.json'),'w').write(json.dumps({'figmaFileKey':'cqQhO3opkgUmaEgOPAEUt3','quality':'original PNG bytes, no recompression','assets':items},indent=2)+'\n')
PY

          git add "$root"
          git commit -m 'assets: add verified HQ Bible Friend PNG source pack'
          git push
