name: Sync Bible Friend HQ Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [agent/records-figma-integration-20260822]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare lossless image tooling
        run: python -m pip install --quiet pillow

      - name: Download original generated sources and create individual PNG assets
        shell: bash
        run: bash scripts/sync_records_assets.sh

      - name: Materialize runtime PNG assets
        run: python scripts/materialize_records_assets.py

      - name: Commit verified runtime assets into branch
        shell: bash
        run: bash scripts/commit_records_assets.sh "${{ github.head_ref || github.ref_name }}"